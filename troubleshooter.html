<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Troubleshooter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#111315; --head:#15181b; --side:#131619; --panel:#181b1f; --field:#1b1f23; --hover:#1f2328;
    --line:#2a2f36; --line2:#343a42; --rule:#23272c;
    --text:#e8eaed; --soft:#c3c9d0; --muted:#9aa3ad;
    --acc:#f5b800; --accInk:#111315; --accBg:#1c1a13; --accLine:#3a3320;
    --ok:#3ecf8e; --okBg:#13201c; --okLine:#23413a; --bad:#ff8a7a;
    --fs:15px; --r:8px;
    --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  }
  body.light{
    --bg:#f3f4f6; --head:#ffffff; --side:#eceef1; --panel:#ffffff; --field:#ffffff; --hover:#e6e9ed;
    --line:#d3d7dd; --line2:#bfc5cd; --rule:#e3e6ea;
    --text:#14171a; --soft:#363c43; --muted:#5a636d;
    --acc:#b47f00; --accInk:#ffffff; --accBg:#fff7e0; --accLine:#e8cf87;
    --ok:#137a4b; --okBg:#e7f6ee; --okLine:#9fd7bb; --bad:#b4321f;
  }
  body.big{ --fs:18px; }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:var(--fs);line-height:1.45;-webkit-tap-highlight-color:transparent}
  button,input,select,textarea{font:inherit;color:inherit}
  a{color:var(--acc)}
  .mono{font-family:var(--mono)} .muted{color:var(--muted)} .muted0{color:var(--soft);margin:0} .small{font-size:.86em} .acc{color:var(--acc)} .right{margin-left:auto}
  .grow{flex:1;min-width:0;display:flex;flex-direction:column}

  /* header */
  header.top{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding:0 20px;background:var(--head);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:12px;padding:10px 0}
  .logo{width:34px;height:34px;border-radius:6px;background:var(--acc);color:var(--accInk);display:grid;place-items:center;font-weight:700;font-family:var(--mono)}
  .brand b{font-size:1.05em;font-weight:600}
  .tabs{display:flex;align-self:stretch}
  .tabs a{display:flex;align-items:center;padding:0 18px;min-height:58px;color:var(--muted);text-decoration:none;font-weight:500;border-bottom:2px solid transparent}
  .tabs a.on{color:var(--text);font-weight:600;border-bottom-color:var(--acc)}
  .searchwrap{position:relative;flex:1 1 300px;max-width:640px}
  .searchwrap label{display:flex;flex-direction:row;align-items:center;gap:10px;height:44px;padding:0 12px;border:1px solid var(--line2);border-radius:6px;background:var(--field)}
  .searchwrap input{flex:1;min-width:0;min-height:0;padding:0;background:transparent;border:0;outline:none;font-size:15px}
  .kbd{font-family:var(--mono);font-size:12px;color:var(--muted);border:1px solid var(--line2);border-radius:4px;padding:2px 6px}
  #gresults{position:absolute;left:0;right:0;top:50px;background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);box-shadow:0 12px 32px rgba(0,0,0,.35);max-height:70vh;overflow:auto;z-index:30}
  .sres{display:flex;flex-direction:column;align-items:flex-start;width:100%;padding:10px 14px;border:0;border-bottom:1px solid var(--rule);background:transparent;text-align:left;text-decoration:none;color:var(--text);cursor:pointer}
  .sres:hover,.sres:focus{background:var(--hover)} .sres span{font-size:.85em;color:var(--muted)} .sempty{padding:14px;color:var(--muted)}
  .status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--soft)} .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
  .iconbtn{width:44px;height:44px;border-radius:6px;border:1px solid var(--line2);background:var(--field);display:grid;place-items:center;cursor:pointer}

  /* layout */
  .page{width:100%;max-width:1240px;margin:0 auto;padding:28px 28px 56px;display:flex;flex-direction:column;gap:22px}
  .page.narrow{max-width:1100px}
  .page.split{flex-direction:row;flex-wrap:wrap;align-items:flex-start;max-width:1240px}
  .page.split>.main{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:20px}
  .page.sm{flex-direction:row;flex-wrap:wrap;max-width:none;padding:0;gap:0}
  .page.sm>.main{flex:999 1 560px;min-width:0;padding:28px 32px 56px;display:flex;flex-direction:column;gap:22px;max-width:1180px}
  .narrowish{max-width:640px!important}
  .h1{margin:0;font-size:1.75em;font-weight:600;letter-spacing:-.01em}
  .label{margin:0 0 10px;font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.08em;color:var(--muted)}
  .label0{font-size:12px;letter-spacing:.08em;color:var(--muted)}
  .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}
  .empty{color:var(--muted);font-size:.92em;padding:6px 0}
  .crumbs{font-size:13px;color:var(--muted);letter-spacing:.04em}

  /* panels */
  .panel{border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
  .panel.pad{padding:16px 18px} .panel h2{margin:0 0 12px;font-size:1em;font-weight:600}
  .phead{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
  .phead h2{margin:0;font-size:1.1em;font-weight:600}
  .pbody{padding:20px;display:flex;flex-direction:column;gap:18px}
  .stepno{font-family:var(--mono);font-size:13px;color:var(--accInk);background:var(--acc);border-radius:4px;padding:2px 8px}

  /* step 1 */
  .makers{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
  .mk{display:flex;align-items:center;gap:14px;min-height:72px;padding:8px 16px 8px 12px;border-radius:6px;border:1px solid var(--line2);background:var(--field);cursor:pointer;text-align:left;color:var(--text)}
  .mk span{display:flex;flex-direction:column} .mk .sub{font-size:13px;color:var(--muted)}
  .mk.on{border-color:var(--acc);background:var(--accBg)} .mk.on .sub{color:var(--soft)}
  .mk svg{flex:none;width:48px;height:48px;color:var(--text)}
  .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
  label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--soft)}
  label.inline{flex-direction:row;align-items:center;gap:10px;font-size:14px;color:var(--text);cursor:pointer}
  input,select,textarea{min-height:48px;border-radius:6px;border:1px solid var(--line2);background:var(--field);color:var(--text);font-size:15px;padding:0 12px}
  textarea{padding:10px 12px;resize:vertical} input[type=checkbox]{min-height:0;width:22px;height:22px;accent-color:var(--acc)}
  .notice{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line2);border-radius:6px;font-size:14px}
  .notice.ok{border-color:var(--okLine);background:var(--okBg)} .notice>span{flex:1 1 300px}

  /* step 2 */
  .symgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(440px,1fr))}
  #known:empty{display:none}
  label>.lt{display:block}
  .sym{display:flex;align-items:center;gap:14px;min-height:68px;padding:8px 20px;border:0;background:transparent;text-align:left;cursor:pointer;color:var(--text);font-size:1.05em}
  .sym:hover,.row:hover,.mrow:hover,.lrow:hover{background:var(--hover)}
  .ficon{width:44px;height:44px;flex:none;border-radius:8px;background:linear-gradient(#3d4550,#2f363f);border:1px solid #4a525d;display:grid;place-items:center}
  .ficon svg{width:38px;height:38px;display:block}

  /* resume */
  .resume{display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:14px 18px;border:1px solid var(--accLine);background:var(--accBg);border-radius:var(--r)}
  .resume .sub{color:var(--soft);font-size:14px}

  /* diagnose */
  .qpanel{padding:26px 26px 22px;display:flex;flex-direction:column;gap:10px}
  .q{margin:6px 0 0;font-size:1.9em;line-height:1.2;font-weight:600}
  .yn{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
  .yn button{min-height:84px;border:0;border-radius:8px;font-size:1.5em;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px}
  .yes{background:#3ecf8e;color:#06210f} .no{background:#ff8a7a;color:#2a0703}
  .key{font-family:var(--mono);font-size:.5em;font-weight:500;border:1px solid currentColor;border-radius:4px;padding:1px 6px;opacity:.7}
  .row-actions{display:flex;gap:10px;margin-top:6px}
  .answers .trow{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--rule);font-size:14px;color:var(--soft)}
  .answers .trow:first-of-type{border-top:1px solid var(--line)} b.yes{background:none;color:var(--ok)} b.no{background:none;color:var(--bad)}

  /* result */
  .check{display:flex;flex-direction:row;align-items:center;gap:14px;min-height:60px;padding:8px 20px;font-size:15px;color:var(--text);cursor:pointer}
  .savebox{flex:1 1 340px;min-width:0;border:1px solid var(--accLine);border-radius:var(--r);background:var(--accBg);position:sticky;top:84px}
  .savebox .phead{border-color:var(--accLine)}
  .form{display:flex;flex-direction:column;gap:14px;padding:16px 18px 18px} .form.tight{padding:0}
  .two{display:flex;flex-wrap:wrap;gap:10px} .two>*{flex:1 1 140px}

  /* buttons */
  .btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 18px;border-radius:6px;border:1px solid transparent;font-weight:600;cursor:pointer;text-decoration:none;background:var(--field);color:var(--text)}
  .btn.primary{background:var(--acc);color:var(--accInk)} .btn.big{min-height:52px;font-size:1.05em}
  .btn.outline{border-color:var(--line2);background:transparent} .resume .btn.outline{border-color:var(--acc);color:var(--acc)}
  .btn.ghost{background:transparent;color:var(--muted);font-weight:500} .btn.small{min-height:36px;padding:0 12px;font-size:14px}
  .linkbtn{border:0;background:none;color:var(--acc);font-weight:600;cursor:pointer;padding:6px 0;text-align:left}
  .backlink{align-self:flex-start;border:0;background:none;color:var(--muted);cursor:pointer;padding:6px 0;font-size:14px}
  .filebtn{position:relative;overflow:hidden;flex-direction:row} .filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}

  /* lists */
  .list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel)}
  .row{display:flex;align-items:center;gap:14px;min-height:58px;padding:10px 16px;border:0;border-bottom:1px solid var(--rule);background:transparent;color:var(--text);text-decoration:none;text-align:left;cursor:pointer;width:100%}
  .row:last-child{border-bottom:0} .row.static{cursor:default}
  .row .sub{font-size:.85em;color:var(--muted);overflow-wrap:anywhere} .row .flag{font-size:.85em;color:var(--acc)}
  .kind{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line2);border-radius:4px;padding:2px 5px;flex:none}
  .chev{color:var(--muted);font-size:1.3em}
  .mthumb{width:56px;height:56px;flex:none;border-radius:8px;object-fit:cover;background:#fff;border:1px solid var(--line)}
  .mphoto{width:110px;height:110px;flex:none;border-radius:12px;object-fit:cover;background:#fff;border:1px solid var(--line)}
  .toggle{justify-content:space-between}
  .switch{width:52px;height:30px;border-radius:999px;background:var(--field);border:1px solid var(--line2);position:relative;flex:none}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:.15s}
  .switch.on{background:var(--acc);border-color:var(--acc)} .switch.on::after{left:25px;background:var(--accInk)}
  .note{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;color:var(--muted);font-size:.86em;margin-top:18px}

  /* service manual */
  .side{flex:1 1 260px;max-width:300px;border-right:1px solid var(--line);background:var(--side);padding:18px 12px;display:flex;flex-direction:column;gap:4px;min-height:calc(100vh - 60px)}
  .sidehead{display:flex;justify-content:space-between;align-items:center;padding:0 6px 8px}
  .sidesearch{margin:0 4px 6px;min-height:40px}
  .mrow{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:10px 12px;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--text);text-align:left;cursor:pointer}
  .mrow span{font-size:12px;color:var(--muted)} .mrow.on{background:var(--hover);border-color:var(--accLine)}
  .lrow{display:flex;justify-content:space-between;align-items:center;min-height:42px;padding:0 12px;border:0;border-radius:6px;background:transparent;color:var(--text);cursor:pointer;text-align:left}
  .lrow .mono{font-size:12px;color:var(--muted)} .badge{font-family:var(--mono);font-size:12px;color:var(--accInk);background:var(--acc);border-radius:4px;padding:1px 7px}
  .divider{height:1px;background:var(--line);margin:12px 4px}
  .rechead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:16px}
  .facts{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;margin-top:8px;font-size:14px;color:var(--soft)}
  .facts label{flex-direction:row;align-items:center;gap:8px;font-size:14px}
  .inl{min-height:34px;width:150px;padding:0 8px;font-size:14px}
  .actions{display:flex;flex-wrap:wrap;gap:10px}
  .subtabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line)}
  .subtabs button{min-height:46px;padding:0 16px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);cursor:pointer}
  .subtabs button.on{color:var(--text);font-weight:600;border-bottom-color:var(--acc)}
  .subbody{display:flex;flex-direction:column;gap:14px}
  .hcard{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:14px 18px;display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
  .hcard.open{border-color:var(--accLine);background:var(--accBg)}
  .hcard h3{margin:0;font-size:1.05em;font-weight:600} .hcard p{margin:0}
  .hhead{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--soft)}
  .pill{font-family:var(--mono);font-size:11px;border-radius:4px;padding:2px 8px} .pill.acc{background:var(--acc);color:var(--accInk)} .pill.ok{color:var(--ok);border:1px solid var(--okLine)}
  .hact{display:flex;flex-wrap:wrap;gap:18px}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0;font-size:14px} .kv dt{color:var(--muted)} .kv dd{margin:0}
  textarea.notes{width:100%;min-height:220px}

  /* library cards (blueprint) */
  .mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
  .mcard{display:block;width:100%;text-align:left;color:#e6f1fa;cursor:pointer;padding:6px 6px 10px;border-radius:10px;background:#0b1824;border:1px solid #2b4a63}
  .mcard:hover{border-color:#5cc2ff}
  .mcard .win{border:1px solid rgba(92,194,255,.45);border-radius:6px;overflow:hidden;background:linear-gradient(#0c2033,#071624)}
  .mcard .bar{display:flex;gap:8px;align-items:center;padding:4px 8px;background:#14588f;font-size:.72em;font-weight:700;color:#fff} .mcard .bar small{font-weight:500;color:#cfe9ff}
  .mcard svg{display:block;width:100%;height:auto}
  .mcard .meta{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:8px 4px 0} .mcard .meta .muted{color:#8fb3cc}

  /* own faults: symptom cells, add-step, dialog */
  .symcell{display:flex;align-items:stretch;border-bottom:1px solid var(--rule);border-right:1px solid var(--rule)}
  .symcell .sym{flex:1;border:0}
  .symedit{flex:none;border:0;border-left:1px solid var(--rule);background:transparent;color:var(--acc);font-weight:600;padding:0 16px;cursor:pointer;min-width:64px}
  .ficon.mine{background:var(--accBg);border-color:var(--accLine);color:var(--acc);font-family:var(--mono);font-size:10px;font-weight:600}
  .checkrow{display:flex;align-items:stretch;border-bottom:1px solid var(--rule)} .checkrow .check{flex:1;border:0}
  .pill.mineP{color:var(--acc);border:1px solid var(--accLine);margin-left:auto}
  .addstep{display:flex;flex-direction:column;gap:8px;padding:14px 20px 18px;font-size:13px;color:var(--soft)}
  .addstep .two input{flex:3 1 260px} .addstep .two button{flex:1 1 120px}
  body.noscroll{overflow:hidden}
  .modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.62);overflow:auto;padding:40px 16px;display:flex;justify-content:center;align-items:flex-start}
  .dialog{width:100%;max-width:780px;background:var(--panel);border:1px solid var(--line2);border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .dhead{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)} .dhead h2{margin:0;font-size:1.2em}
  .dbody{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
  .dfoot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding:14px 20px;border-top:1px solid var(--line)}
  .node{border-left:3px solid var(--line2);padding:6px 0 6px 14px;display:flex;flex-direction:column;gap:10px}
  .node.nq{border-left-color:var(--acc)} .node textarea{min-height:90px}
  .branch{font-family:var(--mono);font-size:12px;letter-spacing:.08em;font-weight:600;margin-top:4px} .branch.byes{color:var(--ok)} .branch.bno{color:var(--bad)}
  .linkbtn.muted{color:var(--muted);font-weight:500}
  #toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:12px 18px;border-radius:8px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:50}
  #toast.on{opacity:1;transform:translate(-50%,0)}
  @media (max-width:700px){
    .page{padding:18px 14px 40px} .page.sm>.main{padding:18px 14px 40px}
    .side{max-width:none;min-height:0;border-right:0;border-bottom:1px solid var(--line)}
    .status{display:none} .tabs a{padding:0 12px} .q{font-size:1.5em}
    header.top{gap:0 12px;padding:0 14px 10px}
    .brand{flex:1 1 auto;order:0} #settingsBtn{order:1} .tabs{order:2;flex:1 1 100%} .searchwrap{order:3;flex:1 1 100%;max-width:none}
    .makers{grid-template-columns:1fr 1fr} .mk{min-height:64px;padding:8px 10px;gap:10px} .mk svg{width:40px;height:40px}
    .symgrid{grid-template-columns:1fr} .sym .mono{display:none} .kbd{display:none}
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5cc2ff" stop-opacity=".05"/><stop offset="1" stop-color="#5cc2ff" stop-opacity=".22"/></linearGradient>
</defs></svg>
<header class="top">
  <div class="brand"><span class="logo">TS</span><b>Troubleshooter</b></div>
  <nav class="tabs" aria-label="Sections"><a href="#" data-tab="ts">Troubleshooter</a><a href="#" data-tab="sm">Service manual</a></nav>
  <div class="searchwrap">
    <label for="gsearch" aria-label="Search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="color:var(--muted)"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="gsearch" type="search" placeholder="Search symptoms, models, serial numbers, documents, part numbers…" autocomplete="off">
      <span class="kbd">Ctrl K</span>
    </label>
    <div id="gresults" hidden></div>
  </div>
  <span class="status"><span class="dot"></span>Works offline</span>
  <button class="iconbtn" id="settingsBtn" aria-label="Settings"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></button>
</header>
<main id="view"></main>
<div id="modal"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>

/* ---------- DOCUMENT FOLDERS ----------

/* ---------- helpers ---------- */
const esc = s => String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const maker = id => MAKERS.find(m=>m.id===id);
const modelById = id => { for(const m of MAKERS){ const md=m.models.find(x=>x.id===id); if(md) return {m,md}; } return null; };
const modelName = id => (modelById(id)||{md:{name:id}}).md.name;
const docsFor = (modelId, kind) => DOCS.filter(d => d.m.includes(modelId) && (!kind || d.k===kind));
const docMaker = d => d.mk || (d.m.length && modelById(d.m[0]) ? modelById(d.m[0]).m.id : "rico");
const docHref = d => DOC_BASE + [FOLDERS[docMaker(d)], ...d.f.split("/")].map(encodeURIComponent).join("/");
const treesFor = makerId => { const m=maker(makerId); return TREES[m.type].filter(t=>!t.maker||t.maker===makerId).concat(CUSTOM.filter(c=>c.type===m.type && (!c.maker||c.maker===makerId)).map(c=>Object.assign({custom:true},c))); };
const extraKey = p => maker(p.maker).type+":"+p.fault+":"+p.path.map(s=>s.a[0]).join("");
const fixesFor = (p,n) => n.fix.concat(EXTRA[extraKey(p)]||[]);
const depth = n => n.fix ? 0 : 1 + Math.max(depth(n.yes), depth(n.no));
const qLabel = n => n ? (n===1 ? "up to 1 question" : `up to ${n} questions`) : "fix list";

/* ---------- navigation ---------- */
let TAB = "ts";                      // "ts" troubleshooter | "sm" service manual | "settings"
let STACK = [{screen:"start", params:{}}];
function go(screen, params={}, replace=false){ if(replace) STACK[STACK.length-1]={screen,params}; else STACK.push({screen,params}); render(); }
function back(){ if(STACK.length>1){ STACK.pop(); render(); } }
function setTab(t){ TAB=t; STACK=[{screen: t==="ts"?"start": t==="sm"?"smhome":"settings", params:{}}]; render(); }
function render(){
  const {screen, params} = STACK[STACK.length-1];
  document.querySelectorAll(".tabs a").forEach(a=>{ const on=a.dataset.tab===TAB; a.classList.toggle("on",on); on?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current"); });
  window.scrollTo(0,0);
  (SCREENS[screen]||SCREENS.start)(params);
}
const backBar = (label) => STACK.length>1 ? `<button class="backlink" onclick="back()">‹ ${esc(label||"Back")}</button>` : "";

/* ---------- global search (Ctrl K) ---------- */
function searchAll(q){
  q=q.trim().toLowerCase(); if(q.length<2) return [];
  const out=[];
  for(const m of MAKERS) for(const f of TREES[m.type]) if(f.title.toLowerCase().includes(q) && !out.some(o=>o.k==="sym"&&o.id===f.id+m.type)) out.push({k:"sym",id:f.id+m.type,t:f.title,s:m.type==="camera"?"Symptom · cameras":"Symptom · cutters",run:()=>{ if(maker(SEL.maker).type!==m.type){ SEL.maker=m.id; SEL.model=(m.models.find(x=>!x.hidden)||{}).id; } setTab("ts"); startDiag(f.id); }});
  for(const m of MAKERS) m.models.forEach((md,i)=>{ if((md.name+" "+m.name).toLowerCase().includes(q)) out.push({k:"mod",t:md.name,s:"Model · "+m.name,run:()=>{ setTab("sm"); go("model",{id:m.id,i}); }}); });
  for(const x of MACHINES) if((x.serial+" "+(x.owner||"")+" "+modelName(x.model)).toLowerCase().includes(q)) out.push({k:"mac",t:`${modelName(x.model)} · SN ${x.serial}`,s:"Machine"+(x.owner?" · "+x.owner:""),run:()=>{ setTab("sm"); go("machine",{id:x.id}); }});
  for(const d of DOCS) if((d.t+" "+d.f+" "+(d.pn||"")).toLowerCase().includes(q)) out.push({k:"doc",t:d.t,s:(d.k==="manual"?"Manual":"Schematic")+(d.pn?" · "+d.pn:"")+" · "+(d.lang||""),href:docHref(d),f:d.f});
  return out.slice(0,14);
}
let RESULTS=[];
function drawSearch(){
  const q=$("gsearch").value, box=$("gresults");

  if(!q.trim()){ box.hidden=true; return; }
  box.hidden=false;
  box.innerHTML = RESULTS.length ? RESULTS.map((r,i)=> r.href

      : `<button class="sres" onclick="pickResult(${i})"><b>${esc(r.t)}</b><span>${esc(r.s)}</span></button>`).join("")
    : `<div class="sempty">Nothing found for “${esc(q)}”</div>`;
}

/* ---------- diagnosis engine ---------- */
function startDiag(faultId){
  const mc = findMachine(SEL.model, SEL.serial);
  PROGRESS = { maker:SEL.maker, model:SEL.model, serial:normSN(SEL.serial), machine: mc?mc.id:null, fault:faultId, path:[], started:today() };
  saveAll(); go("diagnose");
}
function nodeAt(p){ const f=treesFor(p.maker).find(x=>x.id===p.fault); let n=f.tree; for(const s of p.path) n=n[s.a]; return {f,n}; }
function answer(a){ const {n}=nodeAt(PROGRESS); PROGRESS.path.push({q:n.q,a}); saveAll(); render(); }
function stepBack(){ if(PROGRESS.path.length){ PROGRESS.path.pop(); saveAll(); render(); } else { back(); } }
document.addEventListener("keydown", e=>{
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="k"){ e.preventDefault(); $("gsearch").focus(); return; }
  if(e.key==="Escape"){ $("gresults").hidden=true; if(EDIT) closeEditor(); return; }
  if(EDIT) return;
  const tag=(e.target.tagName||"").toLowerCase(); if(tag==="input"||tag==="textarea"||tag==="select") return;
  const top=STACK[STACK.length-1]; if(top.screen!=="diagnose" || !PROGRESS) return;
  const {n}=nodeAt(PROGRESS);
  if(!n.fix && (e.key==="y"||e.key==="Y")) answer("yes");
  else if(!n.fix && (e.key==="n"||e.key==="N")) answer("no");
  else if(e.key==="Backspace"){ e.preventDefault(); stepBack(); }
});

function knownBox(){
  const mc=findMachine(SEL.model, SEL.serial), sn=normSN(SEL.serial);
  if(!sn) return "";
  if(mc){ const n=historyFor(mc.id).length; return `<div class="notice ok"><span>Known machine — this diagnosis will be added to its service history (${n} earlier ${n===1?"entry":"entries"}).</span><button class="linkbtn" onclick="setTab('sm');go('machine',{id:'${mc.id}'})">Open machine record</button></div>`; }
  return `<div class="notice"><span>New machine number — a machine record is created when you save the result.</span></div>`;
}
function updateKnown(){ const k=$("known"); if(k) k.innerHTML=knownBox(); }

  result(){

    const trail=p.path.map(s=>`<div class="trow"><span>${esc(s.q)}</span><b class="${s.a}">${s.a==="yes"?"Yes":"No"}</b></div>`).join("");
    view.innerHTML = `<div class="page split">

        <section><h2 class="label">DOCUMENTS FOR THIS MODEL</h2>${docRows(rel)}${docsFor(p.model).length>6?`<button class="linkbtn" onclick="setTab('sm');go('model',{id:'${p.maker}',i:${maker(p.maker).models.findIndex(x=>x.id===p.model)}})">All ${docsFor(p.model).length} documents ›</button>`:""}</section>

  return `<nav class="side" aria-label="Machines">
    <div class="sidehead"><span class="mono label0">MACHINES</span><button class="btn small outline" onclick="go('addmachine',{})">+ Add</button></div>
    ${MACHINES.length>6?`<input class="sidesearch" placeholder="Filter serial / owner" value="${esc(window._mq||"")}" oninput="window._mq=this.value;render()">`:""}
    ${list.length?list.map(x=>`<button class="mrow ${x.id===activeId?"on":""}" onclick="go('machine',{id:'${x.id}'})"><b>${esc(modelName(x.model))}</b><span class="mono">SN ${esc(x.serial)}${x.owner?" · "+esc(x.owner):""}</span></button>`).join(""):'<p class="muted small" style="padding:0 8px">No machines yet. Enter a serial number when you start a diagnosis, or add one here.</p>'}
    <div class="divider"></div>
    <span class="mono label0">LIBRARY</span>
    ${MAKERS.map(m=>`<button class="lrow" onclick="go('maker',{id:'${m.id}'})">${esc(m.name)}<span class="mono">${m.models.filter(x=>!x.hidden).length}</span></button>`).join("")}
    <button class="lrow" onclick="go('review')">Needs checking<span class="badge">${DOCS.filter(d=>d.check || /unconfirmed/i.test(d.note||"")).length}</span></button>
  </nav>`;
}
function histCard(h){
  const mc=h.machine?MACHINES.find(x=>x.id===h.machine):null;
  return `<article class="hcard ${h.followUp?"open":""}">
    <div class="hhead"><span class="mono">${esc(h.date)}</span>${h.followUp?`<span class="pill acc">FOLLOW-UP</span>`:`<span class="pill ok">FIXED</span>`}</div>
    <h3>${esc(h.faultTitle)}</h3>
    <p class="muted0">${esc(modelName(h.model))}${mc?" · SN "+esc(mc.serial):""}${h.path.length?" · "+h.path.map(s=>esc(s.q.replace(/\?$/,""))+": "+(s.a==="yes"?"Yes":"No")).join(" → "):""}</p>
    ${h.fixedBy?`<p><b>Fixed by:</b> ${esc(h.fixedBy)}</p>`:""}
    ${h.parts?`<p class="muted small">Parts: ${esc(h.parts)}</p>`:""}${h.notes?`<p class="muted small">Notes: ${esc(h.notes)}</p>`:""}
    <div class="hact">${h.followUp?`<button class="linkbtn" onclick="markFixed('${h.id}')">Mark as fixed</button>`:""}<button class="linkbtn" onclick="copyTree('${h.id}')">Copy as fault-tree draft</button>${mc&&STACK[STACK.length-1].screen!=="machine"?`<button class="linkbtn" onclick="go('machine',{id:'${mc.id}'})">Open machine</button>`:""}</div>
  </article>`;
}

/* ---------- actions ---------- */
function restartDiag(){ PROGRESS.path=[]; PROGRESS.done=null; saveAll(); go("diagnose",{},true); }
function saveResult(){
  const p=PROGRESS, {f,n}=nodeAt(p);
  let serial=p.serial || normSN(($("rsn")||{}).value);
  let mid=p.machine;
  if(serial && !mid){ const ex=findMachine(p.model, serial); if(ex) mid=ex.id; else { const nm={id:uid(),maker:p.maker,model:p.model,serial,owner:"",since:"",fields:{},notes:""}; MACHINES.push(nm); mid=nm.id; } }
  HISTORY.push({ id:uid(), machine:mid||null, maker:p.maker, model:p.model, fault:p.fault, faultTitle:f.title, path:p.path, fixes:fixesFor(p,n).map((t,i)=>({t,done:!!(p.done&&p.done[i])})),
    fixedBy:$("rfix").value, parts:$("rparts").value.trim(), notes:$("rnotes").value.trim(), followUp:$("rfollow").checked, date:today() });
  PROGRESS=null; SEL.serial=serial||""; saveAll(); toast("Saved to history");
  if(mid){ TAB="sm"; STACK=[{screen:"smhome",params:{}},{screen:"machine",params:{id:mid}}]; render(); } else setTab("sm");
}
function addMachine(){
  const model=$("amodel").value, serial=normSN($("asn").value);
  if(!serial){ toast("Enter a machine / serial number"); return; }
  const ex=findMachine(model, serial); if(ex){ go("machine",{id:ex.id},true); return; }
  const mk=$("amk").value, nm={id:uid(),maker:mk,model,serial,owner:$("aown").value.trim(),since:$("asince").value.trim(),fields:{},notes:""};
  MACHINES.push(nm); saveAll(); go("machine",{id:nm.id},true);
}
function setMachine(id,k,v){ const x=MACHINES.find(m=>m.id===id); x[k]=v; saveAll(); toast("Saved"); }
function setField(id,k,v){ const x=MACHINES.find(m=>m.id===id); x.fields=x.fields||{}; x.fields[k]=v; saveAll(); toast("Saved"); }
function markFixed(hid){ const h=HISTORY.find(x=>x.id===hid); h.followUp=false; saveAll(); render(); }
function copyTree(hid){
  const h=HISTORY.find(x=>x.id===hid);
  const txt=`Repair for fault tree — ${h.faultTitle} (${modelName(h.model)})\nAnswers: ${h.path.map(s=>s.q+" "+(s.a==="yes"?"Yes":"No")).join(" | ")||"—"}\nSteps done: ${h.fixes.filter(x=>x.done).map(x=>x.t).join(" | ")||"—"}\nFixed by: ${h.fixedBy||"—"}\nParts: ${h.parts||"—"}\nNotes: ${h.notes||"—"}`;
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("Copied — paste it to Claude to make a fault tree"),()=>{ prompt("Copy this text:",txt); });
}
/* Save a file: inside the claude.ai artifact viewer through its downloads permission, otherwise a normal browser download */
async function download(name, text, type){
  const dl = (window.claude && window.claude.use) ? await window.claude.use("downloads").catch(()=>null) : null;
  if(dl){ try{ await dl.save({filename:name, data:text}); toast("Saved "+name); }catch(e){ if(e && e.code!=="declined") toast("Could not save the file here"); } return; }
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; document.body.appendChild(a); a.click(); a.remove();
}
function exportMachine(id){
  const x=MACHINES.find(m=>m.id===id), hs=historyFor(id);
  const txt=`SERVICE HISTORY\n${modelName(x.model)} · SN ${x.serial}\nOwner: ${x.owner||"—"} · In service since: ${x.since||"—"}\n\n`+hs.map(h=>`${h.date}  ${h.followUp?"[FOLLOW-UP]":"[FIXED]"}  ${h.faultTitle}\n  Answers: ${h.path.map(s=>s.q+" "+(s.a==="yes"?"Yes":"No")).join(" | ")||"—"}\n  Fixed by: ${h.fixedBy||"—"}\n  Parts: ${h.parts||"—"}\n  Notes: ${h.notes||"—"}\n`).join("\n");
  download(`history_${x.serial}.txt`, txt, "text/plain");
}
function backupData(){ download(`troubleshooter-backup-${today()}.json`, JSON.stringify({v:2,machines:MACHINES,history:HISTORY,custom:CUSTOM,extra:EXTRA},null,1), "application/json"); }
function restoreData(file){
  if(!file) return; const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!Array.isArray(d.machines)||!Array.isArray(d.history)) throw 0;
    const ids=new Set(MACHINES.map(x=>x.id)), hids=new Set(HISTORY.map(x=>x.id));
    d.machines.forEach(x=>{ if(!ids.has(x.id)) MACHINES.push(x); }); d.history.forEach(x=>{ if(!hids.has(x.id)) HISTORY.push(x); });
    (d.custom||[]).forEach(x=>{ if(!CUSTOM.some(c=>c.id===x.id)) CUSTOM.push(x); });
    Object.entries(d.extra||{}).forEach(([k,v])=>{ EXTRA[k]=[...new Set([...(EXTRA[k]||[]),...v])]; });
    saveAll(); toast("Backup merged"); render(); }catch(e){ toast("That file is not a Troubleshooter backup"); } };
  r.readAsText(file);
}

/* ---------- your own faults & steps ---------- */
function addStep(){
  const inp=$("newstep"), t=(inp.value||"").trim(); if(!t){ inp.focus(); return; }
  const k=extraKey(PROGRESS); EXTRA[k]=(EXTRA[k]||[]).concat(t); saveAll(); toast("Step added"); render();
}
function removeStep(i){ const k=extraKey(PROGRESS), a=EXTRA[k]||[]; const {n}=nodeAt(PROGRESS); a.splice(i,1); if(!a.length) delete EXTRA[k];
  if(PROGRESS.done) PROGRESS.done.splice(n.fix.length+i,1); saveAll(); render(); }
let EDIT=null;
const newQ = () => ({q:"",hint:"",yes:{fix:[""]},no:{fix:[""]}});
function openEditor(id){
  const c=id?CUSTOM.find(x=>x.id===id):null;
  EDIT = c ? JSON.parse(JSON.stringify(c)) : {id:null, type:maker(SEL.maker).type, maker:SEL.maker, title:"", tree:newQ()};
  drawEditor(); setTimeout(()=>{ const t=$("edName"); if(t) t.focus(); },0);
}
function closeEditor(){ EDIT=null; $("modal").innerHTML=""; document.body.classList.remove("noscroll"); }
const pathOf = s => s ? s.split(".") : [];
const joinP = (s,k) => s ? s+"."+k : k;
function getN(s){ let n=EDIT.tree; for(const k of pathOf(s)) n=n[k]; return n; }
function setN(s,node){ const p=pathOf(s); if(!p.length) EDIT.tree=node; else { let par=EDIT.tree; for(const k of p.slice(0,-1)) par=par[k]; par[p[p.length-1]]=node; } drawEditor(); }
function editQ(s,field,v){ getN(s)[field]=v; }
function editFix(s,v){ getN(s).fix=v.split("\n"); }
function toQ(s){ const old=getN(s).fix; setN(s,{q:"",hint:"",yes:{fix:[""]},no:{fix:old.length?old:[""]}}); }
function toFix(s){ setN(s,{fix:[""]}); }
function nodeHTML(n,s,depth){
  if(n.fix) return `<div class="node nf"><label><span class="lt">Fix steps <span class="muted">— one per line, in the order to try them</span></span>
      <textarea rows="${Math.max(3,n.fix.length+1)}" oninput="editFix('${s}',this.value)" placeholder="e.g. Clean the slip ring and brushes with contact cleaner">${esc(n.fix.join("\n"))}</textarea></label>
      ${depth<6?`<button class="linkbtn" onclick="toQ('${s}')">+ Ask a Yes / No question here first</button>`:""}</div>`;
  return `<div class="node nq"><label>Question <input value="${esc(n.q)}" oninput="editQ('${s}','q',this.value)" placeholder="e.g. Do the LEDs in the camera head light up?"></label>
      <label><span class="lt">Hint <span class="muted">(optional — what to look at)</span></span><input value="${esc(n.hint||"")}" oninput="editQ('${s}','hint',this.value)"></label>
      <div class="branch byes">IF YES</div>${nodeHTML(n.yes,joinP(s,"yes"),depth+1)}
      <div class="branch bno">IF NO</div>${nodeHTML(n.no,joinP(s,"no"),depth+1)}
      <button class="linkbtn muted" onclick="toFix('${s}')">Remove this question (replace with a fix list)</button></div>`;
}
function drawEditor(){
  const box=$("modal"), keep=box.firstElementChild?box.firstElementChild.scrollTop:0;
  const makers=MAKERS.filter(m=>m.type===EDIT.type);
  box.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="edTitle"><div class="dialog">
    <div class="dhead"><h2 id="edTitle">${EDIT.id?"Edit fault":"Add fault"}</h2><button class="iconbtn" aria-label="Close" onclick="closeEditor()">✕</button></div>
    <div class="dbody">
      <label>Fault / symptom<input id="edName" value="${esc(EDIT.title)}" oninput="EDIT.title=this.value" placeholder="e.g. Picture rolls when the head rotates"></label>
      <div class="fields">
        <label>Machine type<select onchange="EDIT.type=this.value;EDIT.maker=null;drawEditor()"><option value="camera" ${EDIT.type==="camera"?"selected":""}>Inspection cameras</option><option value="cutter" ${EDIT.type==="cutter"?"selected":""}>CIPP cutters</option></select></label>
        <label>Show for<select onchange="EDIT.maker=this.value||null"><option value="">All ${EDIT.type==="camera"?"camera":"cutter"} manufacturers</option>${makers.map(m=>`<option value="${m.id}" ${EDIT.maker===m.id?"selected":""}>${esc(m.name)} only</option>`).join("")}</select></label>
      </div>
      <h3 class="label" style="margin:6px 0 0">CHECKS AND FIXES</h3>
      <p class="muted small" style="margin:0">Start with a Yes / No question, or remove it to go straight to a fix list. Only use values you have from the manuals or your own measurements.</p>
      ${nodeHTML(EDIT.tree,"",0)}
    </div>
    <div class="dfoot">${EDIT.id?`<button class="btn ghost" style="color:var(--bad)" onclick="deleteFault()">Delete fault</button>`:"<span></span>"}
      <div class="two"><button class="btn outline" onclick="closeEditor()">Cancel</button><button class="btn primary" onclick="saveFault()">Save fault</button></div></div>
  </div></div>`;
  document.body.classList.add("noscroll");
  if(box.firstElementChild) box.firstElementChild.scrollTop=keep;
}
function cleanTree(n){
  if(n.fix){ const f=n.fix.map(x=>x.trim()).filter(Boolean); if(!f.length) throw "Every fix list needs at least one step."; return {fix:f}; }
  const q=(n.q||"").trim(); if(!q) throw "Every question needs text — or remove the question.";
  const o={q, yes:cleanTree(n.yes), no:cleanTree(n.no)}; if((n.hint||"").trim()) o.hint=n.hint.trim(); return o;
}
function saveFault(){
  const title=(EDIT.title||"").trim(); if(!title){ toast("Give the fault a name"); $("edName").focus(); return; }
  let tree; try{ tree=cleanTree(EDIT.tree); }catch(e){ toast(e); return; }
  const rec={ id: EDIT.id || "my_"+uid(), type:EDIT.type, maker:EDIT.maker||null, title, tree, updated:today() };
  const i=CUSTOM.findIndex(c=>c.id===rec.id); if(i>=0) CUSTOM[i]=rec; else CUSTOM.push(rec);
  if(rec.maker && maker(rec.maker).type===rec.type) SEL.maker=rec.maker; else if(maker(SEL.maker).type!==rec.type){ const m=MAKERS.find(x=>x.type===rec.type); SEL.maker=m.id; SEL.model=null; }
  saveAll(); closeEditor(); toast("Fault saved"); setTab("ts");
}
function deleteFault(){
  const c=CUSTOM.find(x=>x.id===EDIT.id); if(!c) return;
  if(!EDIT.confirmDel){ EDIT.confirmDel=true; toast("Tap “Delete fault” again to delete it"); return; }
  CUSTOM=CUSTOM.filter(x=>x.id!==EDIT.id); if(PROGRESS && PROGRESS.fault===EDIT.id) PROGRESS=null; saveAll(); closeEditor(); toast("Fault deleted"); render();
}
function copyFaults(){
  const txt="My Troubleshooter faults — please add these to the app file.\n"+JSON.stringify({custom:CUSTOM,extra:EXTRA},null,1);
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("Copied — paste it to Claude"),()=>{ prompt("Copy this text:",txt); });
}

/* ---------- wire up ---------- */
document.querySelectorAll(".tabs a").forEach(a=>a.addEventListener("click",e=>{ e.preventDefault(); setTab(a.dataset.tab); }));
$("settingsBtn").onclick=()=>setTab("settings");
$("gsearch").addEventListener("input",drawSearch);
$("gsearch").addEventListener("keydown",e=>{ if(e.key==="Enter" && RESULTS[0]){ e.preventDefault(); if(RESULTS[0].href){ window.open(RESULTS[0].href,"_blank"); openDoc(RESULTS[0].f); } else pickResult(0); } });
document.addEventListener("click",e=>{ if(!e.target.closest(".searchwrap")) $("gresults").hidden=true; });
render();

</script>
